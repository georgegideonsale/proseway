name: Bug report
description: Something in the app doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a book
        2. Select a sentence
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Proseway version
      description: Run `proseway --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Computer
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04, Python 3.12"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on the computer, or Safari on iPhone via phone sharing"
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Anything Proseway printed in the terminal. Run with `--verbose` for more.
      render: text
