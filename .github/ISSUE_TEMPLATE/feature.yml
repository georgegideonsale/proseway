name: Feature idea
description: Suggest something that would make reading or studying better.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Please check [ROADMAP.md](../blob/main/ROADMAP.md) first. Many ideas are already planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the reading or study situation, not only the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: This works without accounts, cloud services or sending book text anywhere.
          required: true
