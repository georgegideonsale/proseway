[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proseway"
version = "0.1.0"
description = "Turn a book PDF you own into a calm, reflowable reading edition with highlights and notes. Runs entirely on your own computer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Proseway contributors" }]
keywords = ["pdf", "ebook", "reader", "reflow", "annotations", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11.4",
  "pypdfium2>=4.30",
  "psutil>=5.9",
  "rapidfuzz>=3.9",
  "segno>=1.6",
  # Local CA and server certificate for HTTPS phone sharing. Already required by pdfminer.six.
  "cryptography>=42",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]

[project.scripts]
proseway = "proseway.cli:main"

[project.urls]
Homepage = "https://github.com/georgegideonsale/proseway"
Issues = "https://github.com/georgegideonsale/proseway/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "reportlab>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proseway"]
artifacts = ["src/proseway/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/proseway", "web", "hatch_build.py", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
exclude = ["web/node_modules", "web/dist", "web/test-results", "web/playwright-report"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = [".claude", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# B008: FastAPI's Body()/Depends() defaults are the framework idiom.
# SIM105: explicit try/except/pass reads more clearly in cleanup code.
ignore = ["S101", "S311", "E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "UP031"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
